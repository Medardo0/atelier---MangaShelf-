<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — MangaShelf</title>
  <meta name="description" content="Connectez-vous à votre compte MangaShelf pour gérer votre collection personnelle.">
</head>
<body>

  <a href="#contenu-principal" class="lien-evitement">Aller au contenu principal</a>

  <header role="banner">
    <a href="index.html" aria-label="MangaShelf — retour à l'accueil">
      <strong>MangaShelf</strong>
    </a>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="catalogue.html">Catalogue</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenu-principal">

    <h1>Connexion</h1>
    <p>Accédez à votre collection personnelle de mangas.</p>

    <form method="post" action="../connexion.php" aria-label="Formulaire de connexion" novalidate>

      <input type="hidden" name="csrf_token" value="">

      <div>
        <label for="email-connexion">
          Adresse e-mail
          <abbr title="obligatoire">*</abbr>
        </label>
        <input
          type="email"
          id="email-connexion"
          name="email"
          required
          aria-required="true"
          autocomplete="username"
          placeholder="votre@email.com"
        >
      </div>

      <div>
        <label for="mdp-connexion">
          Mot de passe
          <abbr title="obligatoire">*</abbr>
        </label>
        <input
          type="password"
          id="mdp-connexion"
          name="password"
          required
          aria-required="true"
          autocomplete="current-password"
        >
      </div>

      <div role="alert" aria-live="polite" id="erreur-connexion">
        <!-- Message d'erreur injecté ici si identifiants incorrects -->
      </div>

      <button type="submit">Se connecter</button>

    </form>

    <p>Pas encore de compte ? <a href="inscription.html">Créer un compte gratuitement</a></p>

  </main>

  <footer role="contentinfo">
    <nav aria-label="Navigation secondaire">
      <ul>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="mentions-legales.html">Mentions légales</a></li>
      </ul>
    </nav>
    <p><small>&copy; 2025 MangaShelf</small></p>
  </footer>

</body>
</html>
