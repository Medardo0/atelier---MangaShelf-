<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Administration MangaShelf</title>
  <meta name="description" content="Accès à l'interface d'administration MangaShelf. Réservé aux administrateurs.">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <header role="banner">
    <a href="../public/index.html" aria-label="MangaShelf — voir le site public">
      <strong>MangaShelf</strong>
    </a>
    <p>Administration — accès restreint</p>
  </header>

  <main id="contenu-principal">

    <h1>Connexion administrateur</h1>
    <p>Cet espace est réservé aux administrateurs autorisés.</p>

    <form method="post" action="login.php" aria-label="Formulaire de connexion administrateur" novalidate>

      <input type="hidden" name="csrf_token" value="">

      <fieldset>
        <legend>Identifiants</legend>

        <div>
          <label for="email-admin">
            Adresse e-mail
            <abbr title="obligatoire">*</abbr>
          </label>
          <input
            type="email"
            id="email-admin"
            name="email"
            required
            aria-required="true"
            autocomplete="username"
            placeholder="admin@mangashelf.fr"
          >
        </div>

        <div>
          <label for="mdp-admin">
            Mot de passe
            <abbr title="obligatoire">*</abbr>
          </label>
          <input
            type="password"
            id="mdp-admin"
            name="password"
            required
            aria-required="true"
            autocomplete="current-password"
          >
        </div>

      </fieldset>

      <div role="alert" aria-live="polite" id="erreur-login">
        <!-- Message d'erreur injecté si identifiants incorrects -->
      </div>

      <button type="submit">Se connecter</button>

      <p><small>Après 5 tentatives échouées, le compte est temporairement verrouillé.</small></p>

    </form>

    <p><a href="../public/index.html">Retour au site public</a></p>

  </main>

  <footer role="contentinfo">
    <p><small>&copy; 2025 MangaShelf — Administration</small></p>
  </footer>

</body>
</html>
